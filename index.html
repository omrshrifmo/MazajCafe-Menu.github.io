<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مزاج كافيه</title>
  <link rel="icon" type="image/png" href="mazaj.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Tahoma, sans-serif;
    }

    .hidden {
      display: none !important;
    }

    /* Welcome screen */
    #welcomePage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle, #292929 0%, #0b0b0b 52%, #000 100%);
    }

    .welcome-card {
      width: min(100%, 560px);
      padding: 35px 22px;
      border: 1px solid #b88a43;
      border-radius: 24px;
      background: rgba(15, 15, 15, 0.94);
      box-shadow: 0 0 35px rgba(214, 173, 96, 0.2);
    }

    .welcome-logo {
      display: block;
      width: min(75vw, 300px);
      max-height: 280px;
      margin: 0 auto 25px;
      object-fit: contain;
    }

    .welcome-message {
      margin: 0 0 28px;
      color: #f2d18b;
      font-size: clamp(25px, 5vw, 42px);
      line-height: 1.7;
    }

    .proceed-button {
      padding: 15px 25px;
      border: 1px solid #d6ad60;
      border-radius: 14px;
      background: linear-gradient(135deg, #d6ad60, #a7782d);
      color: #111;
      font-size: clamp(18px, 4vw, 23px);
      font-weight: bold;
      cursor: pointer;
    }

    .proceed-button:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    /* Gallery page */
    #galleryPage {
      min-height: 100vh;
      background: #000;
    }

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 68px;
      padding: 12px 18px;
      border-bottom: 1px solid #333;
      background: #111;
    }

    .page-status {
      color: #f2d18b;
      font-size: 18px;
      font-weight: bold;
    }

    .back-button {
      padding: 9px 14px;
      border: 1px solid #d6ad60;
      border-radius: 9px;
      background: #d6ad60;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    .gallery {
      min-height: calc(100vh - 68px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    .gallery-image {
      display: block;
      width: auto;
      max-width: 45%;
      max-height: 80vh;
      height: auto;
      border-radius: 10px;
      cursor: zoom-in;
      object-fit: contain;
    }

    /* Fullscreen viewer */
    .zoom-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      justify-content: center;
      align-items: center;
      background: #000;
      touch-action: none;
    }

    .zoom-overlay.active {
      display: flex;
    }

    .viewer {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }

    .zoomed-image {
      max-width: 95vw;
      max-height: 95vh;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transform: scale(1);
    }

    .close-button,
    .nav-button,
    .control-button {
      position: absolute;
      z-index: 5;
      border: 1px solid #777;
      border-radius: 8px;
      background: rgba(35, 35, 35, 0.9);
      color: #fff;
      cursor: pointer;
    }

    .close-button {
      top: 15px;
      right: 20px;
      width: 44px;
      height: 42px;
      font-size: 30px;
    }

    .nav-button {
      top: 50%;
      width: 52px;
      height: 70px;
      font-size: 36px;
      transform: translateY(-50%);
    }

    .previous-button {
      left: 15px;
    }

    .next-button {
      right: 15px;
    }

    .top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      z-index: 5;
      display: flex;
      gap: 7px;
      align-items: center;
      direction: ltr;
      transform: translateX(-50%);
    }

    .control-button {
      position: static;
      min-width: 42px;
      height: 42px;
      padding: 0 10px;
      font-size: 18px;
    }

    .zoom-level,
    .image-counter {
      color: #fff;
      background: rgba(35, 35, 35, 0.9);
      border-radius: 20px;
      padding: 7px 12px;
      direction: ltr;
    }

    .image-counter {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
    }

    @media (max-width: 600px) {
      .gallery {
        flex-direction: column;
      }

      .gallery-image {
        max-width: 100%;
        max-height: 75vh;
      }

      .page-status {
        font-size: 14px;
      }

      .gallery-header {
        padding: 10px 12px;
      }

      .nav-button {
        width: 44px;
        height: 60px;
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- This screen appears first -->
  <section id="welcomePage">
    <div class="welcome-card">
      <img
        src="mazaj.png"
        alt="شعار كافيه مزاج"
        class="welcome-logo"
      >

      <h1 class="welcome-message">
        أهلاً بكم في كافيه مزاج
      </h1>

      <button
        id="proceedButton"
        class="proceed-button"
        type="button"
      >
        لفتح المنيو اضغط هنا
      </button>
    </div>
  </section>

  <!-- This screen is hidden initially -->
  <section id="galleryPage" class="hidden">
    <header class="gallery-header">
      <div class="page-status">
        الصفحة 2 من 2 — المنيو
      </div>

      <button
        id="backButton"
        class="back-button"
        type="button"
      >
        العودة للترحيب
      </button>
    </header>

    <main class="gallery">
      <img
        src="mazaj1.png"
        alt="منيو مزاج كافيه - الصفحة الأولى"
        class="gallery-image"
      >

      <img
        src="mazaj2.png"
        alt="منيو مزاج كافيه - الصفحة الثانية"
        class="gallery-image"
      >
    </main>
  </section>

  <!-- Image viewer -->
  <div id="zoomOverlay" class="zoom-overlay">
    <div id="viewer" class="viewer">
      <img
        id="zoomedImage"
        class="zoomed-image"
        src=""
        alt=""
      >
    </div>

    <div class="top-controls">
      <button id="zoomOutButton" class="control-button">−</button>
      <span id="zoomLevel" class="zoom-level">100%</span>
      <button id="zoomInButton" class="control-button">+</button>
      <button id="resetButton" class="control-button">Reset</button>
    </div>

    <button id="closeButton" class="close-button">&times;</button>
    <button id="previousButton" class="nav-button previous-button">&#10094;</button>
    <button id="nextButton" class="nav-button next-button">&#10095;</button>

    <div id="imageCounter" class="image-counter">1 / 2</div>
  </div>

  <script>
    const welcomePage = document.getElementById("welcomePage");
    const galleryPage = document.getElementById("galleryPage");

    const proceedButton = document.getElementById("proceedButton");
    const backButton = document.getElementById("backButton");

    const galleryImages = Array.from(
      document.querySelectorAll(".gallery-image")
    );

    const zoomOverlay = document.getElementById("zoomOverlay");
    const viewer = document.getElementById("viewer");
    const zoomedImage = document.getElementById("zoomedImage");

    const closeButton = document.getElementById("closeButton");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");

    const zoomInButton = document.getElementById("zoomInButton");
    const zoomOutButton = document.getElementById("zoomOutButton");
    const resetButton = document.getElementById("resetButton");

    const zoomLevel = document.getElementById("zoomLevel");
    const imageCounter = document.getElementById("imageCounter");

    let currentIndex = 0;
    let scale = 1;
    let translateX = 0;
    let translateY = 0;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 6;
    const ZOOM_STEP = 0.25;

    let pointers = new Map();
    let lastPinchDistance = null;

    /* Always show the welcome page when the file starts */
    window.addEventListener("DOMContentLoaded", function () {
      welcomePage.classList.remove("hidden");
      galleryPage.classList.add("hidden");
    });

    proceedButton.addEventListener("click", function () {
      welcomePage.classList.add("hidden");
      galleryPage.classList.remove("hidden");
      window.scrollTo(0, 0);
    });

    backButton.addEventListener("click", function () {
      galleryPage.classList.add("hidden");
      welcomePage.classList.remove("hidden");
      window.scrollTo(0, 0);
    });

    function updateTransform() {
      zoomedImage.style.transform =
        `translate(${translateX}px, ${translateY}px) scale(${scale})`;

      zoomLevel.textContent = `${Math.round(scale * 100)}%`;
    }

    function resetZoom() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    function setZoom(value) {
      scale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, value));

      if (scale === 1) {
        translateX = 0;
        translateY = 0;
      }

      updateTransform();
    }

    function showImage(index) {
      currentIndex =
        (index + galleryImages.length) % galleryImages.length;

      zoomedImage.src = galleryImages[currentIndex].src;
      zoomedImage.alt = galleryImages[currentIndex].alt;
      imageCounter.textContent =
        `${currentIndex + 1} / ${galleryImages.length}`;

      resetZoom();
    }

    async function openZoom(index) {
      showImage(index);
      zoomOverlay.classList.add("active");
      document.body.style.overflow = "hidden";

      try {
        if (
          !document.fullscreenElement &&
          zoomOverlay.requestFullscreen
        ) {
          await zoomOverlay.requestFullscreen();
        }
      } catch (error) {
        console.log("Fullscreen unavailable:", error);
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        console.log("Landscape lock unavailable:", error);
      }
    }

    async function closeZoom() {
      try {
        if (
          document.fullscreenElement &&
          document.exitFullscreen
        ) {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.log("Could not exit fullscreen:", error);
      }

      zoomOverlay.classList.remove("active");
      zoomedImage.src = "";
      document.body.style.overflow = "";
      resetZoom();
    }

    galleryImages.forEach(function (image, index) {
      image.addEventListener("click", function () {
        openZoom(index);
      });
    });

    closeButton.addEventListener("click", closeZoom);

    previousButton.addEventListener("click", function () {
      showImage(currentIndex - 1);
    });

    nextButton.addEventListener("click", function () {
      showImage(currentIndex + 1);
    });

    zoomInButton.addEventListener("click", function () {
      setZoom(scale + ZOOM_STEP);
    });

    zoomOutButton.addEventListener("click", function () {
      setZoom(scale - ZOOM_STEP);
    });

    resetButton.addEventListener("click", resetZoom);

    viewer.addEventListener("wheel", function (event) {
      event.preventDefault();

      setZoom(
        scale + (event.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP)
      );
    }, { passive: false });

    zoomedImage.addEventListener("dblclick", function () {
      setZoom(scale === 1 ? 2 : 1);
    });

    viewer.addEventListener("click", function (event) {
      if (event.target === viewer && scale === 1) {
        closeZoom();
      }
    });

    /*
      Basic pinch zoom support.
      Swipe buttons remain available as the main reliable navigation.
    */
    viewer.addEventListener("pointerdown", function (event) {
      viewer.setPointerCapture(event.pointerId);

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (pointers.size === 2) {
        const points = Array.from(pointers.values());

        lastPinchDistance = Math.hypot(
          points[1].x - points[0].x,
          points[1].y - points[0].y
        );
      }
    });

    viewer.addEventListener("pointermove", function (event) {
      if (!pointers.has(event.pointerId)) {
        return;
      }

      event.preventDefault();

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (pointers.size === 2) {
        const points = Array.from(pointers.values());

        const newDistance = Math.hypot(
          points[1].x - points[0].x,
          points[1].y - points[0].y
        );

        if (lastPinchDistance) {
          setZoom(scale + (newDistance - lastPinchDistance) * 0.01);
        }

        lastPinchDistance = newDistance;
      }
    }, { passive: false });

    function removePointer(event) {
      pointers.delete(event.pointerId);

      if (pointers.size < 2) {
        lastPinchDistance = null;
      }
    }

    viewer.addEventListener("pointerup", removePointer);
    viewer.addEventListener("pointercancel", removePointer);

    document.addEventListener("keydown", function (event) {
      if (!zoomOverlay.classList.contains("active")) {
        return;
      }

      if (event.key === "Escape") {
        closeZoom();
      } else if (event.key === "ArrowLeft") {
        showImage(currentIndex - 1);
      } else if (event.key === "ArrowRight") {
        showImage(currentIndex + 1);
      } else if (event.key === "+") {
        setZoom(scale + ZOOM_STEP);
      } else if (event.key === "-") {
        setZoom(scale - ZOOM_STEP);
      } else if (event.key === "0") {
        resetZoom();
      }
    });

    document.addEventListener("fullscreenchange", function () {
      if (
        !document.fullscreenElement &&
        zoomOverlay.classList.contains("active")
      ) {
        zoomOverlay.classList.remove("active");
        zoomedImage.src = "";
        document.body.style.overflow = "";
        resetZoom();
      }
    });
  </script>

</body>
</html>
