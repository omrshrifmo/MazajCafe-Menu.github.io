<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090A0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="منيو كافيه مزاج - قائمة المشروبات والمأكولات بجودة فائقة وسرعة تصفح عالية">

  <title>مزاج كافيه — المنيو</title>

  <link rel="icon" type="image/x-icon" href="mazaj.ico">

  <!-- Resource hints for instant loading -->
  <link rel="preload" as="image" href="mazaj.webp" type="image/webp" fetchpriority="high">
  <link rel="prefetch" href="mazaj1_preview.webp" as="image" type="image/webp">
  <link rel="prefetch" href="mazaj2_preview.webp" as="image" type="image/webp">

  <style>
    :root {
      --gold: #d6ad60;
      --gold-light: #f2d18b;
      --gold-dark: #9d6e28;
      --black: #000;
      --panel: rgba(24, 24, 24, 0.96);
      --border: rgba(255, 255, 255, 0.25);
      --muted: rgba(255, 255, 255, 0.75);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      touch-action: pan-y;
      background: var(--black);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, Tahoma, sans-serif;
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 3px solid var(--gold-light);
      outline-offset: 3px;
    }

    .hidden {
      display: none !important;
    }

    /* Welcome screen */
    #welcomePage {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      text-align: center;
      background:
        radial-gradient(
          circle at center,
          #242424 0%,
          #0e0e0e 55%,
          #000 100%
        );
      transition: opacity 0.25s ease;
    }

    .welcome-card {
      width: min(100%, 540px);
      padding: 38px 24px;
      border: 1px solid rgba(214, 173, 96, 0.55);
      border-radius: 26px;
      background: rgba(14, 14, 14, 0.95);
      box-shadow:
        0 0 45px rgba(214, 173, 96, 0.16),
        0 20px 60px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .welcome-logo {
      display: block;
      width: min(72vw, 280px);
      height: auto;
      aspect-ratio: 1 / 1;
      margin: 0 auto 22px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.5));
    }

    .welcome-message {
      margin: 0 0 28px;
      color: var(--gold-light);
      font-size: clamp(24px, 5.2vw, 40px);
      font-weight: 800;
      line-height: 1.5;
      text-shadow: 0 2px 10px rgba(214, 173, 96, 0.2);
    }

    .proceed-button {
      min-width: min(100%, 320px);
      min-height: 58px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 14px 26px;
      border: 1px solid var(--gold);
      border-radius: 18px;
      background: linear-gradient(135deg, #d6ad60 0%, #b88636 100%);
      color: #0c0c0c;
      font-size: clamp(18px, 4.2vw, 22px);
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 10px 28px rgba(214, 173, 96, 0.28);
      transition:
        transform 0.18s ease,
        filter 0.18s ease,
        box-shadow 0.18s ease;
    }

    .proceed-button:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(214, 173, 96, 0.42);
    }

    .proceed-button:active {
      transform: scale(0.97);
    }

    .button-icon {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3em;
      line-height: 1;
    }

    /* Gallery screen */
    #galleryPage {
      min-height: 100vh;
      min-height: 100dvh;
      background: #000;
    }

    .gallery-header {
      min-height: 68px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding:
        calc(12px + env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        12px
        max(20px, env(safe-area-inset-left));
      border-bottom: 1px solid rgba(214, 173, 96, 0.25);
      background: rgba(16, 16, 16, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-back-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid rgba(214, 173, 96, 0.35);
      border-radius: 12px;
      background: rgba(30, 30, 30, 0.85);
      color: var(--gold-light);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .header-back-button:hover {
      background: rgba(214, 173, 96, 0.18);
      border-color: var(--gold);
    }

    .page-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-light);
      font-size: clamp(16px, 3.2vw, 21px);
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .page-status-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 8px;
      background: rgba(214, 173, 96, 0.16);
      border: 1px solid rgba(214, 173, 96, 0.3);
      font-size: 13px;
      color: #fff;
    }

    .gallery {
      min-height: calc(100vh - 68px);
      min-height: calc(100dvh - 68px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 24px;
      padding: 24px 20px;
      touch-action: pan-y;
      overscroll-behavior-x: none;
    }

    .gallery-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: min(48%, 680px);
      max-height: 82vh;
      overflow: hidden;
      border: 1px solid rgba(214, 173, 96, 0.28);
      border-radius: 16px;
      background: #0d0d0d;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.55),
        0 0 20px rgba(214, 173, 96, 0.08);
      cursor: zoom-in;
      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
      contain: content;
    }

    .gallery-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(214, 173, 96, 0.22);
    }

    .card-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      padding: 4px 10px;
      border-radius: 9px;
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid rgba(214, 173, 96, 0.4);
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .gallery-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 78vh;
      object-fit: contain;
      aspect-ratio: 6250 / 4419;
      border-radius: 15px;
      user-select: none;
      -webkit-user-drag: none;
      transition: filter 0.25s ease;
    }

    .gallery-card:hover .gallery-image {
      filter: brightness(1.06);
    }

    .view-image-button {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 5;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 8px 14px;
      border: 1px solid rgba(214, 173, 96, 0.4);
      border-radius: 12px;
      background: rgba(20, 20, 20, 0.9);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .view-image-button:hover {
      border-color: var(--gold-light);
      background: rgba(85, 65, 32, 0.96);
      transform: scale(1.03);
    }

    /* Fullscreen viewer */
    .zoom-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      overflow: hidden;
      justify-content: center;
      align-items: center;
      background: #000;
      overscroll-behavior: none;
      touch-action: none;
    }

    .zoom-overlay.active {
      display: flex;
    }

    .viewer-layout {
      position: absolute;
      inset:
        calc(86px + env(safe-area-inset-top))
        calc(96px + env(safe-area-inset-right))
        calc(86px + env(safe-area-inset-bottom))
        calc(96px + env(safe-area-inset-left));
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      background:
        radial-gradient(
          circle at center,
          #141414 0%,
          #070707 65%,
          #000 100%
        );
      touch-action: none;
      overscroll-behavior: none;
      cursor: grab;
      contain: layout paint;
    }

    .viewer-layout.dragging {
      cursor: grabbing;
    }

    .zoomed-image-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      will-change: transform;
    }

    .zoomed-image {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      aspect-ratio: 6250 / 4419;
      border-radius: 9px;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* High-res progressive loading badge */
    .quality-indicator {
      position: absolute;
      top: 14px;
      left: calc(18px + env(safe-area-inset-left));
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 12px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(214, 173, 96, 0.35);
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .quality-indicator.loading {
      opacity: 1;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(214, 173, 96, 0.3);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Zoom controls above image */
    .top-controls {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top));
      left: 50%;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      direction: ltr;
      transform: translateX(-50%);
      touch-action: manipulation;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Page number below image */
    .bottom-controls {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: 50%;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--panel);
      transform: translateX(-50%);
      touch-action: manipulation;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .control-button,
    .close-button,
    .nav-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      background: rgba(45, 45, 45, 0.95);
      color: #fff;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition:
        background 0.18s ease,
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .control-button:hover,
    .close-button:hover,
    .nav-button:hover {
      border-color: var(--gold);
      background: rgba(95, 75, 42, 0.96);
      box-shadow: 0 0 15px rgba(214, 173, 96, 0.25);
    }

    .control-button:active,
    .close-button:active {
      transform: scale(0.92);
    }

    .control-button {
      width: 44px;
      height: 44px;
      font-size: 22px;
    }

    .reset-button {
      width: auto;
      padding: 0 14px;
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 700;
    }

    .zoom-level {
      min-width: 62px;
      color: #fff;
      text-align: center;
      direction: ltr;
      font-size: 14px;
      font-weight: bold;
    }

    /* Close button */
    .close-button {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(18px + env(safe-area-inset-right));
      z-index: 25;
      width: 48px;
      height: 44px;
      font-size: 30px;
      line-height: 1;
    }

    /* Side navigation buttons */
    .nav-button {
      position: absolute;
      top: 50%;
      z-index: 25;
      width: 62px;
      height: 84px;
      font-size: 38px;
      line-height: 1;
      transform: translateY(-50%);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }

    .nav-button:active {
      transform: translateY(-50%) scale(0.92);
    }

    .previous-button {
      left: calc(18px + env(safe-area-inset-left));
    }

    .next-button {
      right: calc(18px + env(safe-area-inset-right));
    }

    .image-counter {
      min-width: 60px;
      color: #fff;
      text-align: center;
      direction: ltr;
      font-size: 16px;
      font-weight: bold;
    }

    .counter-label {
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 700;
    }

    .gesture-hint {
      position: absolute;
      right: calc(18px + env(safe-area-inset-right));
      bottom: calc(17px + env(safe-area-inset-bottom));
      z-index: 15;
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    @media (max-width: 768px) {
      .gallery {
        min-height: calc(100dvh - 62px);
        flex-direction: column;
        padding: 16px 12px;
        gap: 18px;
      }

      .gallery-header {
        min-height: 60px;
        padding:
          calc(8px + env(safe-area-inset-top))
          12px
          8px
          12px;
      }

      .gallery-card {
        max-width: 100%;
        max-height: 75vh;
      }

      .gallery-image {
        max-height: 75vh;
      }

      .viewer-layout {
        inset:
          calc(78px + env(safe-area-inset-top))
          calc(56px + env(safe-area-inset-right))
          calc(72px + env(safe-area-inset-bottom))
          calc(56px + env(safe-area-inset-left));
        border-radius: 14px;
      }

      .top-controls {
        top: calc(10px + env(safe-area-inset-top));
        left: 10px;
        gap: 5px;
        padding: 4px 6px;
        transform: none;
      }

      .control-button {
        width: 36px;
        height: 36px;
        font-size: 17px;
      }

      .reset-button {
        padding: 0 8px;
        font-size: 11px;
      }

      .zoom-level {
        min-width: 50px;
        font-size: 12px;
      }

      .close-button {
        top: calc(10px + env(safe-area-inset-top));
        right: calc(10px + env(safe-area-inset-right));
        width: 40px;
        height: 36px;
        font-size: 26px;
      }

      .nav-button {
        width: 44px;
        height: 64px;
        font-size: 28px;
      }

      .previous-button {
        left: calc(6px + env(safe-area-inset-left));
      }

      .next-button {
        right: calc(6px + env(safe-area-inset-right));
      }

      .bottom-controls {
        bottom: calc(10px + env(safe-area-inset-bottom));
        padding: 6px 12px;
      }

      .gesture-hint {
        display: none;
      }

      .view-image-button {
        right: 10px;
        bottom: 10px;
        min-height: 38px;
        padding: 6px 10px;
        font-size: 12px;
      }

      .quality-indicator {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- Welcome screen -->
  <section id="welcomePage">
    <div class="welcome-card">
      <img
        src="mazaj.webp"
        alt="شعار كافيه مزاج"
        class="welcome-logo"
        width="280"
        height="280"
        fetchpriority="high"
        decoding="async"
      >

      <h1 class="welcome-message">
        أهلاً بكم في كافيه مزاج
      </h1>

      <button
        id="proceedButton"
        class="proceed-button"
        type="button"
      >
        <span class="button-icon" aria-hidden="true">☕</span>
        <span>لفتح المنيو اضغط هنا</span>
        <span class="button-icon" aria-hidden="true">→</span>
      </button>
    </div>
  </section>

  <!-- Gallery screen -->
  <section id="galleryPage" class="hidden">
    <header class="gallery-header">
      <button id="backToWelcomeButton" class="header-back-button" type="button" aria-label="العودة للرئيسية">
        <span aria-hidden="true">⟵</span>
        <span>الرئيسية</span>
      </button>

      <div class="page-status">
        <span>منيو كافيه مزاج</span>
        <span class="page-status-badge">صفحتان</span>
      </div>
    </header>

    <main class="gallery">
      <div class="gallery-card" data-card-index="0">
        <div class="card-badge">صفحة 1</div>
        <img
          src="mazaj1_preview.webp"
          data-full="mazaj1.webp"
          alt="منيو مزاج كافيه - الصفحة الأولى"
          class="gallery-image"
          width="1800"
          height="1273"
          loading="eager"
          decoding="async"
        >

        <button
          class="view-image-button"
          type="button"
          data-image-index="0"
          aria-label="فتح الصفحة الأولى بالحجم الكامل"
        >
          <span aria-hidden="true">🔍</span>
          <span>اضغط للمشاهدة والتكبير</span>
        </button>
      </div>

      <div class="gallery-card" data-card-index="1">
        <div class="card-badge">صفحة 2</div>
        <img
          src="mazaj2_preview.webp"
          data-full="mazaj2.webp"
          alt="منيو مزاج كافيه - الصفحة الثانية"
          class="gallery-image"
          width="1800"
          height="1273"
          loading="eager"
          decoding="async"
        >

        <button
          class="view-image-button"
          type="button"
          data-image-index="1"
          aria-label="فتح الصفحة الثانية بالحجم الكامل"
        >
          <span aria-hidden="true">🔍</span>
          <span>اضغط للمشاهدة والتكبير</span>
        </button>
      </div>
    </main>
  </section>

  <!-- Fullscreen image viewer -->
  <div
    id="zoomOverlay"
    class="zoom-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="عارض صور المنيو"
  >
    <!-- Subtle high-res loading badge -->
    <div id="qualityIndicator" class="quality-indicator">
      <div class="spinner"></div>
      <span>جاري تحميل الجودة الفائقة...</span>
    </div>

    <!-- Dedicated image viewing area -->
    <div
      id="viewerLayout"
      class="viewer-layout"
    >
      <div id="zoomedImageContainer" class="zoomed-image-container">
        <img
          id="zoomedImage"
          class="zoomed-image"
          src=""
          alt=""
          decoding="async"
        >
      </div>
    </div>

    <!-- Zoom controls above the image -->
    <div class="top-controls">
      <button
        id="zoomOutButton"
        class="control-button"
        type="button"
        aria-label="تصغير"
        title="تصغير"
      >
        −
      </button>

      <span
        id="zoomLevel"
        class="zoom-level"
      >
        100%
      </span>

      <button
        id="zoomInButton"
        class="control-button"
        type="button"
        aria-label="تكبير"
        title="تكبير"
      >
        +
      </button>

      <button
        id="resetButton"
        class="control-button reset-button"
        type="button"
        aria-label="إعادة ضبط التكبير"
        title="إعادة ضبط التكبير"
      >
        Reset
      </button>
    </div>

    <!-- Close button -->
    <button
      id="closeButton"
      class="close-button"
      type="button"
      aria-label="إغلاق"
      title="إغلاق"
    >
      &times;
    </button>

    <!-- Previous image button -->
    <button
      id="previousButton"
      class="nav-button previous-button"
      type="button"
      aria-label="الصفحة السابقة"
      title="الصفحة السابقة"
    >
      &#10094;
    </button>

    <!-- Next image button -->
    <button
      id="nextButton"
      class="nav-button next-button"
      type="button"
      aria-label="الصفحة التالية"
      title="الصفحة التالية"
    >
      &#10095;
    </button>

    <!-- Page indicator below the image -->
    <div class="bottom-controls">
      <span class="counter-label">
        صفحة
      </span>

      <span
        id="imageCounter"
        class="image-counter"
      >
        1 / 2
      </span>
    </div>

    <div id="gestureHint" class="gesture-hint">
      اسحب للتبديل • انقر مرتين للتكبير • حرّك بحرية
    </div>
  </div>

  <script>
    // Register Service Worker for instant offline & caching
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.debug('Service Worker register skipped:', err);
        });
      });
    }

    const welcomePage = document.getElementById("welcomePage");
    const galleryPage = document.getElementById("galleryPage");
    const proceedButton = document.getElementById("proceedButton");
    const backToWelcomeButton = document.getElementById("backToWelcomeButton");

    const galleryCards = Array.from(document.querySelectorAll(".gallery-card"));
    const galleryImages = Array.from(document.querySelectorAll(".gallery-image"));
    const viewImageButtons = Array.from(document.querySelectorAll(".view-image-button"));

    const zoomOverlay = document.getElementById("zoomOverlay");
    const viewerLayout = document.getElementById("viewerLayout");
    const zoomedImageContainer = document.getElementById("zoomedImageContainer");
    const zoomedImage = document.getElementById("zoomedImage");
    const qualityIndicator = document.getElementById("qualityIndicator");
    const gestureHint = document.getElementById("gestureHint");

    const closeButton = document.getElementById("closeButton");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");

    const zoomInButton = document.getElementById("zoomInButton");
    const zoomOutButton = document.getElementById("zoomOutButton");
    const resetButton = document.getElementById("resetButton");

    const zoomLevel = document.getElementById("zoomLevel");
    const imageCounter = document.getElementById("imageCounter");

    let currentIndex = 0;
    let scale = 1;
    let translateX = 0;
    let translateY = 0;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 6;
    const ZOOM_STEP = 0.35;

    // Dimensions cache to avoid layout thrashing
    let layoutWidth = 0;
    let layoutHeight = 0;
    let imgNaturalWidth = 6250;
    let imgNaturalHeight = 4419;

    let pointers = new Map();
    let lastPinchDistance = null;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let startingTranslateX = 0;
    let startingTranslateY = 0;
    let lastTapTime = 0;

    // Horizontal swipe detection when scale === 1
    let swipeStartX = 0;
    let swipeStartY = 0;
    let isSwiping = false;

    // RAF batching
    let rafId = null;

    function scheduleTransformUpdate() {
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        zoomedImageContainer.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;
        zoomLevel.textContent = `${Math.round(scale * 100)}%`;
        rafId = null;
      });
    }

    function refreshLayoutBounds() {
      layoutWidth = viewerLayout.clientWidth;
      layoutHeight = viewerLayout.clientHeight;
    }

    function limitPan() {
      if (scale <= 1) {
        translateX = 0;
        translateY = 0;
        return;
      }

      // Compute rendered size inside container
      const containerRatio = layoutWidth / (layoutHeight || 1);
      const imgRatio = imgNaturalWidth / imgNaturalHeight;

      let renderedWidth, renderedHeight;
      if (containerRatio > imgRatio) {
        renderedHeight = layoutHeight;
        renderedWidth = renderedHeight * imgRatio;
      } else {
        renderedWidth = layoutWidth;
        renderedHeight = renderedWidth / imgRatio;
      }

      const scaledWidth = renderedWidth * scale;
      const scaledHeight = renderedHeight * scale;

      const maximumX = Math.max(0, (scaledWidth - layoutWidth) / 2);
      const maximumY = Math.max(0, (scaledHeight - layoutHeight) / 2);

      translateX = Math.max(-maximumX, Math.min(maximumX, translateX));
      translateY = Math.max(-maximumY, Math.min(maximumY, translateY));
    }

    function setZoom(newScale, focalX = 0, focalY = 0) {
      const oldScale = scale;
      scale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newScale));

      if (scale === MIN_ZOOM) {
        translateX = 0;
        translateY = 0;
      } else if (oldScale !== scale && (focalX !== 0 || focalY !== 0)) {
        // Zoom toward focal point
        const ratio = scale / oldScale;
        translateX = focalX - (focalX - translateX) * ratio;
        translateY = focalY - (focalY - translateY) * ratio;
      }

      limitPan();
      scheduleTransformUpdate();
    }

    function resetZoom() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      scheduleTransformUpdate();
    }

    // High-res progressive image loader
    let activeLoader = null;
    function loadProgressiveImage(index) {
      const selectedEl = galleryImages[index];
      const previewSrc = selectedEl.src;
      const fullSrc = selectedEl.getAttribute("data-full") || previewSrc;

      // Set preview immediately for zero-delay instant render
      zoomedImage.src = previewSrc;
      zoomedImage.alt = selectedEl.alt;

      if (activeLoader) {
        activeLoader.onload = null;
        activeLoader.onerror = null;
      }

      // If fullSrc is different from preview, upgrade smoothly
      if (fullSrc && fullSrc !== previewSrc) {
        qualityIndicator.classList.add("loading");
        const loader = new Image();
        activeLoader = loader;

        loader.onload = () => {
          if (currentIndex === index && activeLoader === loader) {
            zoomedImage.src = fullSrc;
            qualityIndicator.classList.remove("loading");
          }
        };

        loader.onerror = () => {
          qualityIndicator.classList.remove("loading");
        };

        loader.src = fullSrc;
      } else {
        qualityIndicator.classList.remove("loading");
      }
    }

    function showImage(index) {
      currentIndex = (index + galleryImages.length) % galleryImages.length;
      refreshLayoutBounds();
      loadProgressiveImage(currentIndex);
      imageCounter.textContent = `${currentIndex + 1} / ${galleryImages.length}`;
      resetZoom();
    }

    async function openViewer(index) {
      showImage(index);
      zoomOverlay.classList.add("active");
      document.body.style.overflow = "hidden";
      refreshLayoutBounds();

      // Auto-hide gesture hint after 4 seconds
      if (gestureHint) {
        gestureHint.style.opacity = "1";
        setTimeout(() => {
          gestureHint.style.opacity = "0";
        }, 4000);
      }

      try {
        if (!document.fullscreenElement && zoomOverlay.requestFullscreen) {
          await zoomOverlay.requestFullscreen();
        }
      } catch (e) {
        // Fullscreen not allowed or supported; fallback gracefully
      }
    }

    async function closeViewer() {
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
        }
      } catch (e) {
        // Exit fullscreen failed; ignore
      }

      zoomOverlay.classList.remove("active");
      document.body.style.overflow = "";
      resetZoom();
    }

    // Background prefetching of full master images during idle time
    function preloadMasterImages() {
      galleryImages.forEach((img) => {
        const fullSrc = img.getAttribute("data-full");
        if (fullSrc) {
          const preloader = new Image();
          preloader.src = fullSrc;
        }
      });
    }

    // Navigation interactions
    proceedButton.addEventListener("click", () => {
      welcomePage.classList.add("hidden");
      galleryPage.classList.remove("hidden");
      window.scrollTo(0, 0);

      // Start prefetching high-res master images in idle time
      if ('requestIdleCallback' in window) {
        requestIdleCallback(preloadMasterImages, { timeout: 1500 });
      } else {
        setTimeout(preloadMasterImages, 500);
      }
    });

    backToWelcomeButton.addEventListener("click", () => {
      galleryPage.classList.add("hidden");
      welcomePage.classList.remove("hidden");
      window.scrollTo(0, 0);
    });

    // Gallery card clicks
    galleryCards.forEach((card, index) => {
      card.addEventListener("click", () => openViewer(index));
    });

    // Gallery call-to-action buttons
    viewImageButtons.forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const index = Number(btn.getAttribute("data-image-index"));
        openViewer(index);
      });
    });

    // Next / Previous buttons
    previousButton.addEventListener("click", (e) => {
      e.stopPropagation();
      showImage(currentIndex - 1);
    });

    nextButton.addEventListener("click", (e) => {
      e.stopPropagation();
      showImage(currentIndex + 1);
    });

    // Close button
    closeButton.addEventListener("click", (e) => {
      e.stopPropagation();
      closeViewer();
    });

    // Zoom buttons
    zoomInButton.addEventListener("click", (e) => {
      e.stopPropagation();
      setZoom(scale + ZOOM_STEP);
    });

    zoomOutButton.addEventListener("click", (e) => {
      e.stopPropagation();
      setZoom(scale - ZOOM_STEP);
    });

    resetButton.addEventListener("click", (e) => {
      e.stopPropagation();
      resetZoom();
    });

    // Mouse-wheel zoom
    viewerLayout.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;
      const rect = viewerLayout.getBoundingClientRect();
      const focalX = e.clientX - (rect.left + rect.width / 2);
      const focalY = e.clientY - (rect.top + rect.height / 2);
      setZoom(scale + delta, focalX, focalY);
    }, { passive: false });

    // Double click / double tap zoom
    viewerLayout.addEventListener("pointerdown", (e) => {
      const now = Date.now();
      if (now - lastTapTime < 320 && pointers.size === 0) {
        e.preventDefault();
        const rect = viewerLayout.getBoundingClientRect();
        const focalX = e.clientX - (rect.left + rect.width / 2);
        const focalY = e.clientY - (rect.top + rect.height / 2);
        if (scale > 1.2) {
          resetZoom();
        } else {
          setZoom(2.5, focalX, focalY);
        }
        lastTapTime = 0;
        return;
      }
      lastTapTime = now;

      viewerLayout.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        if (scale > 1) {
          isDragging = true;
          viewerLayout.classList.add("dragging");
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          startingTranslateX = translateX;
          startingTranslateY = translateY;
        } else {
          // Track potential swipe between pages
          isSwiping = true;
          swipeStartX = e.clientX;
          swipeStartY = e.clientY;
        }
      } else if (pointers.size === 2) {
        isDragging = false;
        isSwiping = false;
        viewerLayout.classList.remove("dragging");
        const pts = Array.from(pointers.values());
        lastPinchDistance = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      }
    }, { passive: false });

    viewerLayout.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      // Pinch zoom
      if (pointers.size === 2) {
        e.preventDefault();
        const pts = Array.from(pointers.values());
        const newDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);

        if (lastPinchDistance && lastPinchDistance > 0) {
          const ratio = newDist / lastPinchDistance;
          setZoom(scale * ratio);
        }
        lastPinchDistance = newDist;
        return;
      }

      // Drag when zoomed in
      if (isDragging && scale > 1) {
        e.preventDefault();
        translateX = startingTranslateX + (e.clientX - dragStartX);
        translateY = startingTranslateY + (e.clientY - dragStartY);
        limitPan();
        scheduleTransformUpdate();
      }
    }, { passive: false });

    function handlePointerEnd(e) {
      if (pointers.has(e.pointerId)) {
        // If swiping at 1x zoom, detect horizontal flick
        if (isSwiping && scale <= 1 && pointers.size === 1) {
          const deltaX = e.clientX - swipeStartX;
          const deltaY = e.clientY - swipeStartY;
          if (Math.abs(deltaX) > 60 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
            if (deltaX < 0) {
              // Swiped left -> next page
              showImage(currentIndex + 1);
            } else {
              // Swiped right -> prev page
              showImage(currentIndex - 1);
            }
          }
        }

        pointers.delete(e.pointerId);
      }

      if (pointers.size < 2) {
        lastPinchDistance = null;
      }

      if (pointers.size === 0) {
        isDragging = false;
        isSwiping = false;
        viewerLayout.classList.remove("dragging");
      }
    }

    viewerLayout.addEventListener("pointerup", handlePointerEnd);
    viewerLayout.addEventListener("pointercancel", handlePointerEnd);

    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
      if (!zoomOverlay.classList.contains("active")) return;

      if (e.key === "Escape") closeViewer();
      if (e.key === "ArrowLeft") showImage(currentIndex - 1);
      if (e.key === "ArrowRight") showImage(currentIndex + 1);
      if (e.key === "+" || e.key === "=") setZoom(scale + ZOOM_STEP);
      if (e.key === "-") setZoom(scale - ZOOM_STEP);
      if (e.key === "0") resetZoom();
    });

    // Window resize handler
    window.addEventListener("resize", () => {
      refreshLayoutBounds();
      if (zoomOverlay.classList.contains("active")) {
        limitPan();
        scheduleTransformUpdate();
      }
    });

    // Fullscreen exit sync
    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && zoomOverlay.classList.contains("active")) {
        // Keep active or exit cleanly depending on user preference
      }
    });
  </script>
</body>
</html>
