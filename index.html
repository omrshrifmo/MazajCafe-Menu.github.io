  <!-- Resource hints for instant loading -->
  <link rel="preload" as="image" href="mazaj.webp" type="image/webp" fetchpriority="high">
  <link rel="prefetch" href="mazaj1_preview.webp" as="image" type="image/webp">
  <link rel="prefetch" href="mazaj2_preview.webp" as="image" type="image/webp">
</head>

<body>

  <!-- Welcome screen -->
  <section id="welcomePage">
    <div class="welcome-card">
      <img
        src="mazaj.webp"
        alt="شعار كافيه مزاج"
        class="welcome-logo"
        width="280"
        height="280"
        fetchpriority="high"
        loading="eager"
        decoding="async"
      >

      <h1 class="welcome-message">
        أهلاً بكم في كافيه مزاج
      </h1>

      <button
        id="proceedButton"
        class="proceed-button"
        type="button"
      >
        <span class="button-icon" aria-hidden="true">☕</span>
        <span>لفتح المنيو اضغط هنا</span>
        <span class="button-icon" aria-hidden="true">→</span>
      </button>
    </div>
  </section>

  <!-- Gallery screen -->
  <section id="galleryPage" class="hidden">
    <header class="gallery-header">
      <button id="backToWelcomeButton" class="header-back-button" type="button" aria-label="العودة للرئيسية">
        <span aria-hidden="true">⟵</span>
        <span>الرئيسية</span>
      </button>

      <div class="page-status">
        <span>منيو كافيه مزاج</span>
        <span class="page-status-badge">صفحتان</span>
      </div>
    </header>

    <main class="gallery">
      <div class="gallery-card" data-card-index="0">
        <div class="card-badge">صفحة 1</div>
        <img
          src="mazaj1.webp"
          srcset="mazaj1_preview.webp 1800w, mazaj1.webp 6250w"
          sizes="(max-width: 768px) 100vw, 50vw"
          data-preview="mazaj1_preview.webp"
          data-full="mazaj1.webp"
          alt="منيو مزاج كافيه - الصفحة الأولى"
          class="gallery-image"
          width="1800"
          height="1273"
          loading="lazy"
          decoding="async"
        >

        <button
          class="view-image-button"
          type="button"
          data-image-index="0"
          aria-label="فتح الصفحة الأولى بالحجم الكامل"
        >
          <span aria-hidden="true">🔍</span>
          <span>اضغط للمشاهدة والتكبير</span>
        </button>
      </div>

      <div class="gallery-card" data-card-index="1">
        <div class="card-badge">صفحة 2</div>
        <img
          src="mazaj2.webp"
          srcset="mazaj2_preview.webp 1800w, mazaj2.webp 6250w"
          sizes="(max-width: 768px) 100vw, 50vw"
          data-preview="mazaj2_preview.webp"
          data-full="mazaj2.webp"
          alt="منيو مزاج كافيه - الصفحة الثانية"
          class="gallery-image"
          width="1800"
          height="1273"
          loading="lazy"
          decoding="async"
        >

        <button
          class="view-image-button"
          type="button"
          data-image-index="1"
          aria-label="فتح الصفحة الثانية بالحجم الكامل"
        >
          <span aria-hidden="true">🔍</span>
          <span>اضغط للمشاهدة والتكبير</span>
        </button>
      </div>
    </main>
  </section>

  <!-- Fullscreen image viewer -->
  <div
    id="zoomOverlay"
    class="zoom-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="عارض صور المنيو"
  >
    <div id="qualityIndicator" class="quality-indicator">
      <div class="spinner"></div>
      <span>جاري تحميل الجودة الفائقة...</span>
    </div>

    <div id="viewerLayout" class="viewer-layout">
      <div id="zoomedImageContainer" class="zoomed-image-container">
        <img
          id="zoomedImage"
          class="zoomed-image"
          src=""
          alt=""
          decoding="async"
        >
      </div>
    </div>

    <div class="top-controls">
      <button id="zoomOutButton" class="control-button" type="button" aria-label="تصغير" title="تصغير">−</button>
      <span id="zoomLevel" class="zoom-level">100%</span>
      <button id="zoomInButton" class="control-button" type="button" aria-label="تكبير" title="تكبير">+</button>
      <button id="resetButton" class="control-button reset-button" type="button" aria-label="إعادة ضبط التكبير" title="إعادة ضبط التكبير">Reset</button>
    </div>

    <button id="closeButton" class="close-button" type="button" aria-label="إغلاق" title="إغلاق">&times;</button>
    <button id="previousButton" class="nav-button previous-button" type="button" aria-label="الصفحة السابقة" title="الصفحة السابقة">&#10094;</button>
    <button id="nextButton" class="nav-button next-button" type="button" aria-label="الصفحة التالية" title="الصفحة التالية">&#10095;</button>

    <div class="bottom-controls">
      <span class="counter-label">صفحة</span>
      <span id="imageCounter" class="image-counter">1 / 2</span>
    </div>

    <div id="gestureHint" class="gesture-hint">
      اسحب للتبديل • انقر مرتين للتكبير • حرّك بحرية
    </div>
  </div>

  <!-- Deferred minified app script -->
  <script src="app.min.js" defer></script>
</body>
</html>
