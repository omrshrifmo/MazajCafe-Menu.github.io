<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مزاج كافيه</title>

  <link rel="icon" type="image/png" href="mazaj.ico">

  <style>
    :root {
      --gold: #d6ad60;
      --gold-light: #f2d18b;
      --dark: #080808;
      --panel: #151515;
      --text-muted: #c8c8c8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Tahoma, sans-serif;
    }

    button {
      font: inherit;
    }

    /* General pages */
    .page {
      min-height: 100vh;
      width: 100%;
    }

    .hidden {
      display: none !important;
    }

    /* Welcome page */
    .welcome-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at center, #282828 0%, #0c0c0c 48%, #000 100%);
    }

    .welcome-card {
      width: min(100%, 560px);
      padding: 36px 24px;
      border: 1px solid rgba(214, 173, 96, 0.35);
      border-radius: 24px;
      background: rgba(15, 15, 15, 0.88);
      box-shadow:
        0 0 35px rgba(214, 173, 96, 0.12),
        0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .welcome-logo {
      display: block;
      width: min(72vw, 300px);
      max-height: 260px;
      margin: 0 auto 26px;
      object-fit: contain;
    }

    .welcome-title {
      margin: 0 0 28px;
      color: var(--gold-light);
      font-size: clamp(25px, 5vw, 42px);
      font-weight: 700;
      line-height: 1.6;
    }

    .proceed-button,
    .back-button {
      border: 1px solid var(--gold);
      border-radius: 14px;
      background: linear-gradient(135deg, #d6ad60, #a7782d);
      color: #111;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(214, 173, 96, 0.2);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }

    .proceed-button {
      min-width: min(100%, 310px);
      padding: 15px 24px;
      font-size: clamp(18px, 4vw, 23px);
    }

    .proceed-button:hover,
    .back-button:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(214, 173, 96, 0.35);
    }

    .proceed-button:active,
    .back-button:active,
    .control-button:active,
    .nav-button:active {
      transform: scale(0.96);
    }

    /* Gallery page */
    .gallery-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .gallery-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 68px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(8, 8, 8, 0.96);
      backdrop-filter: blur(10px);
    }

    .page-status {
      color: var(--gold-light);
      font-size: clamp(14px, 3vw, 19px);
      font-weight: 700;
    }

    .back-button {
      padding: 9px 14px;
      font-size: 14px;
      white-space: nowrap;
    }

    .gallery {
      flex: 1;
      min-height: calc(100vh - 68px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      overscroll-behavior-x: none;
    }

    .gallery-image {
      display: block;
      width: auto;
      max-width: 45%;
      max-height: 80vh;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      cursor: zoom-in;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 0.25s ease;
    }

    .gallery-image:hover {
      transform: scale(1.03);
    }

    /* Fullscreen viewer */
    .zoom-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      overflow: hidden;
      justify-content: center;
      align-items: center;
      background: #000;
      overscroll-behavior: none;
    }

    .zoom-overlay.active {
      display: flex;
    }

    .viewer {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      cursor: grab;
    }

    .viewer.dragging {
      cursor: grabbing;
    }

    .zoomed-image {
      display: block;
      width: auto;
      height: auto;
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 8px;
      user-select: none;
      -webkit-user-drag: none;
      transform: translate3d(0, 0, 0) scale(1);
      transform-origin: center center;
      will-change: transform;
    }

    /* Viewer controls */
    .top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 7px;
      direction: ltr;
      transform: translateX(-50%);
    }

    .control-button,
    .close-button,
    .nav-button {
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(30, 30, 30, 0.88);
      color: #fff;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease;
    }

    .control-button:hover,
    .close-button:hover,
    .nav-button:hover {
      background: rgba(90, 90, 90, 0.95);
    }

    .control-button {
      min-width: 44px;
      height: 42px;
      padding: 0 11px;
      font-size: 20px;
    }

    .zoom-level {
      min-width: 55px;
      color: #fff;
      text-align: center;
      font-size: 14px;
    }

    .close-button {
      position: absolute;
      top: 15px;
      right: 20px;
      z-index: 6;
      width: 44px;
      height: 42px;
      font-size: 30px;
      line-height: 1;
    }

    .nav-button {
      position: absolute;
      top: 50%;
      z-index: 5;
      width: 54px;
      height: 72px;
      font-size: 38px;
      line-height: 1;
      transform: translateY(-50%);
    }

    .previous-button {
      left: 15px;
    }

    .next-button {
      right: 15px;
    }

    .image-counter {
      position: absolute;
      bottom: 18px;
      left: 50%;
      z-index: 5;
      padding: 7px 13px;
      border-radius: 20px;
      background: rgba(30, 30, 30, 0.85);
      color: #fff;
      direction: ltr;
      font-size: 14px;
      transform: translateX(-50%);
    }

    @media (max-width: 600px) {
      .welcome-card {
        padding: 28px 18px;
      }

      .gallery-header {
        min-height: 62px;
        padding: 10px 12px;
      }

      .gallery {
        min-height: calc(100vh - 62px);
        flex-direction: column;
        padding: 16px 10px;
      }

      .gallery-image {
        max-width: 100%;
        max-height: 75vh;
      }

      .top-controls {
        top: 12px;
        left: 15px;
        transform: none;
      }

      .close-button {
        top: 12px;
        right: 15px;
      }

      .control-button {
        min-width: 38px;
        height: 38px;
        padding: 0 9px;
        font-size: 18px;
      }

      .nav-button {
        width: 44px;
        height: 60px;
        font-size: 30px;
      }

      .previous-button {
        left: 8px;
      }

      .next-button {
        right: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- Welcome page -->
  <section
    class="page welcome-page"
    id="welcomePage"
    aria-labelledby="welcomeTitle"
  >
    <div class="welcome-card">
      <img
        src="mazaj.png"
        alt="شعار كافيه مزاج"
        class="welcome-logo"
      >

      <h1 class="welcome-title" id="welcomeTitle">
        أهلاً بكم في كافيه مزاج
      </h1>

      <button
        class="proceed-button"
        id="proceedButton"
        type="button"
      >
        لفتح المنيو اضغط هنا
      </button>
    </div>
  </section>

  <!-- Gallery page -->
  <section
    class="page gallery-page hidden"
    id="galleryPage"
    aria-label="قائمة مزاج كافيه"
  >
    <header class="gallery-header">
      <div class="page-status">
        الصفحة 2 من 2 — المنيو
      </div>

      <button
        class="back-button"
        id="backButton"
        type="button"
      >
        العودة للترحيب
      </button>
    </header>

    <main class="gallery">
      <img
        src="mazaj1.png"
        alt="منيو مزاج كافيه - الصفحة الأولى"
        class="gallery-image"
      >

      <img
        src="mazaj2.png"
        alt="منيو مزاج كافيه - الصفحة الثانية"
        class="gallery-image"
      >
    </main>
  </section>

  <!-- Fullscreen viewer -->
  <div
    class="zoom-overlay"
    id="zoomOverlay"
    role="dialog"
    aria-modal="true"
    aria-label="عارض صور المنيو"
  >
    <div class="viewer" id="viewer">
      <img
        src=""
        alt=""
        class="zoomed-image"
        id="zoomedImage"
      >
    </div>

    <div class="top-controls">
      <button
        class="control-button"
        id="zoomOutButton"
        type="button"
        aria-label="تصغير"
      >
        −
      </button>

      <span
        class="zoom-level"
        id="zoomLevel"
      >
        100%
      </span>

      <button
        class="control-button"
        id="zoomInButton"
        type="button"
        aria-label="تكبير"
      >
        +
      </button>

      <button
        class="control-button"
        id="resetButton"
        type="button"
        aria-label="إعادة ضبط التكبير"
      >
        Reset
      </button>
    </div>

    <button
      class="close-button"
      id="closeButton"
      type="button"
      aria-label="إغلاق"
    >
      &times;
    </button>

    <button
      class="nav-button previous-button"
      id="previousButton"
      type="button"
      aria-label="الصورة السابقة"
    >
      &#10094;
    </button>

    <button
      class="nav-button next-button"
      id="nextButton"
      type="button"
      aria-label="الصورة التالية"
    >
      &#10095;
    </button>

    <div
      class="image-counter"
      id="imageCounter"
    >
      1 / 2
    </div>
  </div>

  <script>
    const welcomePage = document.getElementById("welcomePage");
    const galleryPage = document.getElementById("galleryPage");

    const proceedButton = document.getElementById("proceedButton");
    const backButton = document.getElementById("backButton");

    const galleryImages = Array.from(
      document.querySelectorAll(".gallery-image")
    );

    const zoomOverlay = document.getElementById("zoomOverlay");
    const viewer = document.getElementById("viewer");
    const zoomedImage = document.getElementById("zoomedImage");

    const closeButton = document.getElementById("closeButton");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");

    const zoomInButton = document.getElementById("zoomInButton");
    const zoomOutButton = document.getElementById("zoomOutButton");
    const resetButton = document.getElementById("resetButton");

    const zoomLevel = document.getElementById("zoomLevel");
    const imageCounter = document.getElementById("imageCounter");

    let currentIndex = 0;
    let scale = 1;
    let translateX = 0;
    let translateY = 0;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 6;
    const ZOOM_STEP = 0.25;

    let pointers = new Map();
    let lastPinchDistance = null;

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let startTranslateX = 0;
    let startTranslateY = 0;

    let swipeStartX = 0;
    let swipeStartY = 0;

    function showGalleryPage() {
      welcomePage.classList.add("hidden");
      galleryPage.classList.remove("hidden");

      document.title = "منيو مزاج كافيه";
      window.scrollTo(0, 0);
    }

    function showWelcomePage() {
      galleryPage.classList.add("hidden");
      welcomePage.classList.remove("hidden");

      document.title = "مزاج كافيه";
      window.scrollTo(0, 0);
    }

    function updateImageTransform() {
      zoomedImage.style.transform =
        `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;

      zoomLevel.textContent = `${Math.round(scale * 100)}%`;
    }

    function limitPan() {
      const maxPanX = Math.max(
        0,
        (zoomedImage.clientWidth * scale - viewer.clientWidth) / 2
      );

      const maxPanY = Math.max(
        0,
        (zoomedImage.clientHeight * scale - viewer.clientHeight) / 2
      );

      translateX = Math.max(-maxPanX, Math.min(maxPanX, translateX));
      translateY = Math.max(-maxPanY, Math.min(maxPanY, translateY));
    }

    function setZoom(newScale) {
      scale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newScale));

      if (scale === MIN_ZOOM) {
        translateX = 0;
        translateY = 0;
      }

      limitPan();
      updateImageTransform();
    }

    function resetZoom() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateImageTransform();
    }

    function changeZoom(amount) {
      setZoom(scale + amount);
    }

    function updateImageInfo() {
      imageCounter.textContent =
        `${currentIndex + 1} / ${galleryImages.length}`;
    }

    function showImage(index) {
      currentIndex =
        (index + galleryImages.length) % galleryImages.length;

      const image = galleryImages[currentIndex];

      zoomedImage.src = image.src;
      zoomedImage.alt = image.alt;

      resetZoom();
      updateImageInfo();
    }

    async function openZoom(index) {
      showImage(index);

      zoomOverlay.classList.add("active");
      document.body.style.overflow = "hidden";

      try {
        if (
          !document.fullscreenElement &&
          zoomOverlay.requestFullscreen
        ) {
          await zoomOverlay.requestFullscreen();
        }
      } catch (error) {
        console.log("Fullscreen was not available:", error);
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        console.log("Landscape lock was not available:", error);
      }
    }

    async function closeZoom() {
      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      } catch (error) {
        console.log("Orientation unlock was not available:", error);
      }

      try {
        if (
          document.fullscreenElement &&
          document.exitFullscreen
        ) {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.log("Fullscreen exit failed:", error);
      }

      zoomOverlay.classList.remove("active");
      zoomedImage.src = "";
      document.body.style.overflow = "";
      resetZoom();
    }

    function showPreviousImage() {
      showImage(currentIndex - 1);
    }

    function showNextImage() {
      showImage(currentIndex + 1);
    }

    function getPinchDistance() {
      const activePointers = Array.from(pointers.values());

      if (activePointers.length < 2) {
        return 0;
      }

      const firstPointer = activePointers[0];
      const secondPointer = activePointers[1];

      return Math.hypot(
        secondPointer.x - firstPointer.x,
        secondPointer.y - firstPointer.y
      );
    }

    // Welcome and page navigation
    proceedButton.addEventListener("click", showGalleryPage);
    backButton.addEventListener("click", showWelcomePage);

    // Open an image
    galleryImages.forEach(function (image, index) {
      image.addEventListener("click", function () {
        openZoom(index);
      });
    });

    // Viewer buttons
    closeButton.addEventListener("click", closeZoom);
    previousButton.addEventListener("click", showPreviousImage);
    nextButton.addEventListener("click", showNextImage);

    zoomInButton.addEventListener("click", function () {
      changeZoom(ZOOM_STEP);
    });

    zoomOutButton.addEventListener("click", function () {
      changeZoom(-ZOOM_STEP);
    });

    resetButton.addEventListener("click", resetZoom);

    // Close when clicking empty viewer space at normal zoom
    viewer.addEventListener("click", function (event) {
      if (event.target === viewer && scale === 1) {
        closeZoom();
      }
    });

    // Mouse-wheel zoom
    viewer.addEventListener(
      "wheel",
      function (event) {
        event.preventDefault();

        const amount = event.deltaY < 0
          ? ZOOM_STEP
          : -ZOOM_STEP;

        changeZoom(amount);
      },
      { passive: false }
    );

    // Double-click or double-tap style zoom
    zoomedImage.addEventListener("dblclick", function (event) {
      event.preventDefault();

      if (scale === 1) {
        setZoom(2);
      } else {
        resetZoom();
      }
    });

    // Pointer down
    viewer.addEventListener("pointerdown", function (event) {
      event.preventDefault();

      viewer.setPointerCapture(event.pointerId);

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      swipeStartX = event.clientX;
      swipeStartY = event.clientY;

      if (pointers.size === 1 && scale > 1) {
        isDragging = true;
        viewer.classList.add("dragging");

        dragStartX = event.clientX;
        dragStartY = event.clientY;
        startTranslateX = translateX;
        startTranslateY = translateY;
      }

      if (pointers.size === 2) {
        isDragging = false;
        lastPinchDistance = getPinchDistance();
      }
    });

    // Pointer movement: drag or pinch
    viewer.addEventListener("pointermove", function (event) {
      if (!pointers.has(event.pointerId)) {
        return;
      }

      event.preventDefault();

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (pointers.size === 2) {
        const newPinchDistance = getPinchDistance();

        if (lastPinchDistance) {
          const difference = newPinchDistance - lastPinchDistance;
          setZoom(scale + difference * 0.01);
        }

        lastPinchDistance = newPinchDistance;
        return;
      }

      if (isDragging && scale > 1) {
        translateX =
          startTranslateX + event.clientX - dragStartX;

        translateY =
          startTranslateY + event.clientY - dragStartY;

        limitPan();
        updateImageTransform();
      }
    });

    function finishPointer(event) {
      const wasLastPointer = pointers.size === 1;

      pointers.delete(event.pointerId);

      if (pointers.size < 2) {
        lastPinchDistance = null;
      }

      if (pointers.size === 0) {
        isDragging = false;
        viewer.classList.remove("dragging");
      }

      // Swipe only when the image is not zoomed
      if (wasLastPointer && scale === 1) {
        const distanceX = event.clientX - swipeStartX;
        const distanceY = event.clientY - swipeStartY;

        if (
          Math.abs(distanceX) > 60 &&
          Math.abs(distanceX) > Math.abs(distanceY)
        ) {
          if (distanceX < 0) {
            showNextImage();
          } else {
            showPreviousImage();
          }
        }
      }
    }

    viewer.addEventListener("pointerup", finishPointer);
    viewer.addEventListener("pointercancel", finishPointer);

    // Keyboard controls
    document.addEventListener("keydown", function (event) {
      if (!zoomOverlay.classList.contains("active")) {
        return;
      }

      if (event.key === "Escape") {
        closeZoom();
      } else if (event.key === "ArrowLeft") {
        showPreviousImage();
      } else if (event.key === "ArrowRight") {
        showNextImage();
      } else if (
        event.key === "+" ||
        event.key === "="
      ) {
        changeZoom(ZOOM_STEP);
      } else if (event.key === "-") {
        changeZoom(-ZOOM_STEP);
      } else if (event.key === "0") {
        resetZoom();
      }
    });

    // Close if fullscreen is exited using browser controls
    document.addEventListener("fullscreenchange", function () {
      if (
        !document.fullscreenElement &&
        zoomOverlay.classList.contains("active")
      ) {
        zoomOverlay.classList.remove("active");
        zoomedImage.src = "";
        document.body.style.overflow = "";
        resetZoom();
      }
    });

    // Keep image inside the viewer after resizing or rotating
    window.addEventListener("resize", function () {
      if (zoomOverlay.classList.contains("active")) {
        limitPan();
        updateImageTransform();
      }
    });
  </script>

</body>
</html>
