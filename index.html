<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>مزاج كافيه</title>

  <link rel="icon" type="image/png" href="mazaj.ico">

  <style>
    :root {
      --gold: #d6ad60;
      --gold-light: #f2d18b;
      --black: #000;
      --panel: #141414;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;

      /*
        Prevent horizontal browser back/forward swipe while
        preserving normal vertical page behavior.
      */
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }

    body {
      background: var(--black);
      color: #fff;
      font-family: Arial, Tahoma, sans-serif;
    }

    button {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* Welcome screen */
    #welcomePage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(
          circle at center,
          #2b2b2b 0%,
          #0b0b0b 50%,
          #000 100%
        );
    }

    .welcome-card {
      width: min(100%, 560px);
      padding: 36px 22px;
      border: 1px solid rgba(214, 173, 96, 0.6);
      border-radius: 24px;
      background: rgba(15, 15, 15, 0.95);
      box-shadow: 0 0 40px rgba(214, 173, 96, 0.18);
    }

    .welcome-logo {
      display: block;
      width: min(75vw, 300px);
      max-height: 280px;
      margin: 0 auto 25px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .welcome-message {
      margin: 0 0 28px;
      color: var(--gold-light);
      font-size: clamp(25px, 5vw, 42px);
      line-height: 1.7;
    }

    .proceed-button {
      min-width: min(100%, 320px);
      padding: 15px 24px;
      border: 1px solid var(--gold);
      border-radius: 14px;
      background: linear-gradient(135deg, #d6ad60, #a7782d);
      color: #111;
      font-size: clamp(18px, 4vw, 23px);
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .proceed-button:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    /* Gallery screen */
    #galleryPage {
      min-height: 100vh;
      background: #000;
    }

    .gallery-header {
      min-height: 68px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid #333;
      background: #111;
    }

    .page-status {
      color: var(--gold-light);
      font-size: clamp(16px, 3vw, 22px);
      font-weight: bold;
    }

    .gallery {
      min-height: calc(100vh - 68px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;

      /*
        The page itself does not handle horizontal gestures.
        Image controls remain clickable.
      */
      touch-action: pan-y;
      overscroll-behavior-x: none;
    }

    .gallery-image {
      display: block;
      width: auto;
      max-width: 45%;
      max-height: 80vh;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      cursor: zoom-in;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 0.25s ease;
    }

    .gallery-image:hover {
      transform: scale(1.03);
    }

    /* Fullscreen viewer */
    .zoom-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      overflow: hidden;
      justify-content: center;
      align-items: center;
      background: #000;

      /*
        Only the viewer captures gestures.
        This allows custom drag and pinch handling.
      */
      touch-action: none;
      overscroll-behavior: none;
    }

    .zoom-overlay.active {
      display: flex;
    }

    .viewer {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      /*
        Required for custom one-finger dragging and pinch zoom.
      */
      touch-action: none;
      overscroll-behavior: none;
      cursor: grab;
    }

    .viewer.dragging {
      cursor: grabbing;
    }

    .zoomed-image {
      display: block;
      width: auto;
      height: auto;
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 8px;
      user-select: none;
      -webkit-user-drag: none;
      transform: translate3d(0, 0, 0) scale(1);
      transform-origin: center center;
      will-change: transform;
    }

    /* Viewer controls */
    .top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 7px;
      direction: ltr;
      transform: translateX(-50%);
      touch-action: manipulation;
    }

    .control-button,
    .close-button,
    .nav-button {
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      background: rgba(35, 35, 35, 0.92);
      color: #fff;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .control-button:hover,
    .close-button:hover,
    .nav-button:hover {
      background: rgba(85, 85, 85, 0.95);
    }

    .control-button:active,
    .close-button:active,
    .nav-button:active {
      transform: scale(0.94);
    }

    .control-button {
      min-width: 42px;
      height: 42px;
      padding: 0 10px;
      font-size: 19px;
    }

    .zoom-level {
      min-width: 58px;
      padding: 7px 8px;
      color: #fff;
      text-align: center;
      font-size: 14px;
    }

    .close-button {
      position: absolute;
      top: 15px;
      right: 20px;
      z-index: 6;
      width: 44px;
      height: 42px;
      font-size: 30px;
      line-height: 1;
    }

    .nav-button {
      position: absolute;
      top: 50%;
      z-index: 5;
      width: 56px;
      height: 74px;
      font-size: 38px;
      line-height: 1;
      transform: translateY(-50%);
    }

    .nav-button:active {
      transform: translateY(-50%) scale(0.94);
    }

    .previous-button {
      left: 15px;
    }

    .next-button {
      right: 15px;
    }

    .image-counter {
      position: absolute;
      bottom: 18px;
      left: 50%;
      z-index: 5;
      padding: 7px 13px;
      border-radius: 20px;
      background: rgba(35, 35, 35, 0.9);
      color: #fff;
      direction: ltr;
      font-size: 14px;
      transform: translateX(-50%);
    }

    @media (max-width: 600px) {
      .gallery {
        min-height: calc(100vh - 62px);
        flex-direction: column;
        padding: 16px 10px;
      }

      .gallery-header {
        min-height: 62px;
      }

      .gallery-image {
        max-width: 100%;
        max-height: 75vh;
      }

      .top-controls {
        top: 12px;
        left: 15px;
        transform: none;
      }

      .close-button {
        top: 12px;
        right: 15px;
      }

      .control-button {
        min-width: 38px;
        height: 38px;
        padding: 0 8px;
        font-size: 17px;
      }

      .nav-button {
        width: 44px;
        height: 60px;
        font-size: 30px;
      }

      .previous-button {
        left: 8px;
      }

      .next-button {
        right: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- Welcome screen -->
  <section id="welcomePage">
    <div class="welcome-card">
      <img
        src="mazaj.png"
        alt="شعار كافيه مزاج"
        class="welcome-logo"
      >

      <h1 class="welcome-message">
        أهلاً بكم في كافيه مزاج
      </h1>

      <button
        id="proceedButton"
        class="proceed-button"
        type="button"
      >
        لفتح المنيو اضغط هنا
      </button>
    </div>
  </section>

  <!-- Gallery screen -->
  <section id="galleryPage" class="hidden">
    <header class="gallery-header">
      <div class="page-status">
        الصفحة 2 من 2 — المنيو
      </div>
    </header>

    <main class="gallery">
      <img
        src="mazaj1.png"
        alt="منيو مزاج كافيه - الصفحة الأولى"
        class="gallery-image"
      >

      <img
        src="mazaj2.png"
        alt="منيو مزاج كافيه - الصفحة الثانية"
        class="gallery-image"
      >
    </main>
  </section>

  <!-- Fullscreen image viewer -->
  <div
    id="zoomOverlay"
    class="zoom-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="عارض صور المنيو"
  >
    <div id="viewer" class="viewer">
      <img
        id="zoomedImage"
        class="zoomed-image"
        src=""
        alt=""
      >
    </div>

    <div class="top-controls">
      <button
        id="zoomOutButton"
        class="control-button"
        type="button"
        aria-label="تصغير"
      >
        −
      </button>

      <span
        id="zoomLevel"
        class="zoom-level"
      >
        100%
      </span>

      <button
        id="zoomInButton"
        class="control-button"
        type="button"
        aria-label="تكبير"
      >
        +
      </button>

      <button
        id="resetButton"
        class="control-button"
        type="button"
        aria-label="إعادة ضبط التكبير"
      >
        Reset
      </button>
    </div>

    <button
      id="closeButton"
      class="close-button"
      type="button"
      aria-label="إغلاق"
    >
      &times;
    </button>

    <button
      id="previousButton"
      class="nav-button previous-button"
      type="button"
      aria-label="الصفحة السابقة"
    >
      &#10094;
    </button>

    <button
      id="nextButton"
      class="nav-button next-button"
      type="button"
      aria-label="الصفحة التالية"
    >
      &#10095;
    </button>

    <div
      id="imageCounter"
      class="image-counter"
    >
      1 / 2
    </div>
  </div>

  <script>
    const welcomePage = document.getElementById("welcomePage");
    const galleryPage = document.getElementById("galleryPage");
    const proceedButton = document.getElementById("proceedButton");

    const galleryImages = Array.from(
      document.querySelectorAll(".gallery-image")
    );

    const zoomOverlay = document.getElementById("zoomOverlay");
    const viewer = document.getElementById("viewer");
    const zoomedImage = document.getElementById("zoomedImage");

    const closeButton = document.getElementById("closeButton");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");

    const zoomInButton = document.getElementById("zoomInButton");
    const zoomOutButton = document.getElementById("zoomOutButton");
    const resetButton = document.getElementById("resetButton");

    const zoomLevel = document.getElementById("zoomLevel");
    const imageCounter = document.getElementById("imageCounter");

    let currentIndex = 0;
    let scale = 1;
    let translateX = 0;
    let translateY = 0;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 6;
    const ZOOM_STEP = 0.25;

    let pointers = new Map();
    let lastPinchDistance = null;

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let startingTranslateX = 0;
    let startingTranslateY = 0;

    function updateTransform() {
      zoomedImage.style.transform =
        `translate3d(${translateX}px, ${translateY}px, 0)
         scale(${scale})`;

      zoomLevel.textContent = `${Math.round(scale * 100)}%`;
    }

    function limitPan() {
      const imageWidth = zoomedImage.clientWidth * scale;
      const imageHeight = zoomedImage.clientHeight * scale;

      const maximumX = Math.max(
        0,
        (imageWidth - viewer.clientWidth) / 2
      );

      const maximumY = Math.max(
        0,
        (imageHeight - viewer.clientHeight) / 2
      );

      translateX = Math.max(
        -maximumX,
        Math.min(maximumX, translateX)
      );

      translateY = Math.max(
        -maximumY,
        Math.min(maximumY, translateY)
      );
    }

    function setZoom(newScale) {
      scale = Math.max(
        MIN_ZOOM,
        Math.min(MAX_ZOOM, newScale)
      );

      if (scale === MIN_ZOOM) {
        translateX = 0;
        translateY = 0;
      }

      limitPan();
      updateTransform();
    }

    function resetZoom() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    function showImage(index) {
      currentIndex =
        (index + galleryImages.length) % galleryImages.length;

      const selectedImage = galleryImages[currentIndex];

      zoomedImage.src = selectedImage.src;
      zoomedImage.alt = selectedImage.alt;

      imageCounter.textContent =
        `${currentIndex + 1} / ${galleryImages.length}`;

      resetZoom();
    }

    async function openViewer(index) {
      showImage(index);

      zoomOverlay.classList.add("active");
      document.body.style.overflow = "hidden";

      try {
        if (
          !document.fullscreenElement &&
          zoomOverlay.requestFullscreen
        ) {
          await zoomOverlay.requestFullscreen();
        }
      } catch (error) {
        console.log("Fullscreen unavailable:", error);
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        console.log("Landscape lock unavailable:", error);
      }
    }

    async function closeViewer() {
      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      } catch (error) {
        console.log("Orientation unlock unavailable:", error);
      }

      try {
        if (
          document.fullscreenElement &&
          document.exitFullscreen
        ) {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.log("Could not exit fullscreen:", error);
      }

      zoomOverlay.classList.remove("active");
      zoomedImage.src = "";
      document.body.style.overflow = "";
      resetZoom();
    }

    // Open gallery page
    proceedButton.addEventListener("click", function () {
      welcomePage.classList.add("hidden");
      galleryPage.classList.remove("hidden");
      window.scrollTo(0, 0);
    });

    // Open an image
    galleryImages.forEach(function (image, index) {
      image.addEventListener("click", function () {
        openViewer(index);
      });
    });

    // Previous and next buttons
    previousButton.addEventListener("click", function (event) {
      event.stopPropagation();
      showImage(currentIndex - 1);
    });

    nextButton.addEventListener("click", function (event) {
      event.stopPropagation();
      showImage(currentIndex + 1);
    });

    closeButton.addEventListener("click", function (event) {
      event.stopPropagation();
      closeViewer();
    });

    zoomInButton.addEventListener("click", function (event) {
      event.stopPropagation();
      setZoom(scale + ZOOM_STEP);
    });

    zoomOutButton.addEventListener("click", function (event) {
      event.stopPropagation();
      setZoom(scale - ZOOM_STEP);
    });

    resetButton.addEventListener("click", function (event) {
      event.stopPropagation();
      resetZoom();
    });

    // Mouse-wheel zoom
    viewer.addEventListener(
      "wheel",
      function (event) {
        event.preventDefault();

        setZoom(
          scale + (event.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP)
        );
      },
      { passive: false }
    );

    // Double-click zoom
    zoomedImage.addEventListener("dblclick", function (event) {
      event.preventDefault();
      setZoom(scale === 1 ? 2 : 1);
    });

    // Close when clicking empty space
    viewer.addEventListener("click", function (event) {
      if (event.target === viewer && scale === 1) {
        closeViewer();
      }
    });

    /*
      Pointer down:
      - One finger while zoomed: prepare image dragging.
      - Two fingers: prepare pinch zoom.
    */
    viewer.addEventListener(
      "pointerdown",
      function (event) {
        event.preventDefault();

        viewer.setPointerCapture(event.pointerId);

        pointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });

        if (pointers.size === 1 && scale > 1) {
          isDragging = true;
          viewer.classList.add("dragging");

          dragStartX = event.clientX;
          dragStartY = event.clientY;

          startingTranslateX = translateX;
          startingTranslateY = translateY;
        }

        if (pointers.size === 2) {
          isDragging = false;
          viewer.classList.remove("dragging");

          const points = Array.from(pointers.values());

          lastPinchDistance = Math.hypot(
            points[1].x - points[0].x,
            points[1].y - points[0].y
          );
        }
      },
      { passive: false }
    );

    /*
      Pointer move:
      - One finger while zoomed: move/pan the image.
      - Two fingers: pinch zoom.
    */
    viewer.addEventListener(
      "pointermove",
      function (event) {
        if (!pointers.has(event.pointerId)) {
          return;
        }

        event.preventDefault();

        pointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });

        if (pointers.size === 2) {
          const points = Array.from(pointers.values());

          const newPinchDistance = Math.hypot(
            points[1].x - points[0].x,
            points[1].y - points[0].y
          );

          if (lastPinchDistance) {
            const distanceChange =
              newPinchDistance - lastPinchDistance;

            setZoom(scale + distanceChange * 0.01);
          }

          lastPinchDistance = newPinchDistance;
          return;
        }

        if (isDragging && scale > 1) {
          translateX =
            startingTranslateX +
            event.clientX -
            dragStartX;

          translateY =
            startingTranslateY +
            event.clientY -
            dragStartY;

          limitPan();
          updateTransform();
        }
      },
      { passive: false }
    );

    function finishPointer(event) {
      pointers.delete(event.pointerId);

      if (pointers.size < 2) {
        lastPinchDistance = null;
      }

      if (pointers.size === 0) {
        isDragging = false;
        viewer.classList.remove("dragging");
      }
    }

    viewer.addEventListener("pointerup", finishPointer);
    viewer.addEventListener("pointercancel", finishPointer);

    // Keyboard controls
    document.addEventListener("keydown", function (event) {
      if (!zoomOverlay.classList.contains("active")) {
        return;
      }

      if (event.key === "Escape") {
        closeViewer();
      } else if (event.key === "ArrowLeft") {
        showImage(currentIndex - 1);
      } else if (event.key === "ArrowRight") {
        showImage(currentIndex + 1);
      } else if (
        event.key === "+" ||
        event.key === "="
      ) {
        setZoom(scale + ZOOM_STEP);
      } else if (event.key === "-") {
        setZoom(scale - ZOOM_STEP);
      } else if (event.key === "0") {
        resetZoom();
      }
    });

    // Keep panning within the screen after rotation/resizing
    window.addEventListener("resize", function () {
      if (zoomOverlay.classList.contains("active")) {
        limitPan();
        updateTransform();
      }
    });

    // Close if the user exits fullscreen using browser controls
    document.addEventListener("fullscreenchange", function () {
      if (
        !document.fullscreenElement &&
        zoomOverlay.classList.contains("active")
      ) {
        zoomOverlay.classList.remove("active");
        zoomedImage.src = "";
        document.body.style.overflow = "";
        resetZoom();
      }
    });
  </script>

</body>
</html>
